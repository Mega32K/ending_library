plugins {
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_name + "-1.20.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = true
    runs {
        client {
            client()
            jvmArgument "-XX:+AllowEnhancedClassRedefinition"
            systemProperty 'stdout.encoding', 'UTF-8'
            systemProperty 'stderr.encoding', 'UTF-8'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            jvmArgument "-XX:+AllowEnhancedClassRedefinition"
            systemProperty 'stdout.encoding', 'UTF-8'
            systemProperty 'stderr.encoding', 'UTF-8'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').toString(), '--existing', file('src/main/resources/').toString()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1")
    implementation("io.github.llamalad7:mixinextras-common:0.4.1")
    modImplementation("io.github.llamalad7:mixinextras-forge:0.4.1")
    modImplementation("curse.maven:playerAnimator-658587:4587214")
    // Keep original jar-in-jar behavior: embed required runtime jars into the final mod jar.
    jarJar("io.github.llamalad7:mixinextras-forge:0.4.1") {
        version {
            strictly("[0.4.1,)")
            prefer("0.4.1")
        }
    }
    jarJar("curse.maven:playerAnimator-658587:4587214") {
        version {
            strictly("[1.0.2,)")
            prefer("1.0.2")
        }
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    modImplementation("curse.maven:Oculus-581495:5299671")
    modImplementation("curse.maven:Xenon-564239:5752040")
    modImplementation("curse.maven:IBE-256822:4994072")
    modImplementation("curse.maven:ClothConfig-348521:5729105")
    modImplementation("curse.maven:BetterCombat-639842:5625757")
    modImplementation("curse.maven:curios-309927:5367944")
    modImplementation("curse.maven:appleskin-248787:4770828")
    //modImplementation("curse.maven:ModernUI-352491:6199942")
    implementation fileTree("libs")

}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "MixinsConfig" : "${mod_id}.mixins.json",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
repositories {
    maven {
        url "https://cursemaven.com"
    }
    maven {
        name = "Iron's Maven - Release"
        url = "https://code.redspace.io/releases"
    }
    maven {
        name = "Iron's Maven - Snapshots"
        url = "https://code.redspace.io/snapshots"
    }
}

